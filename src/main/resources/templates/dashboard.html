<!DOCTYPE html>
<html lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title th:text="#{dashboard}">Dashboard</title>
    <link rel="stylesheet" href="/css/dash.css">
    <link rel="stylesheet" href="/css/language-selector.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
    <input type="hidden" id="user-matricule" th:value="${#authentication.name}" />
    
    <!-- Include language selector -->
    <div th:replace="fragments/language-selector :: language-selector"></div>

    <header class="header">
        <div class="header-wrapper">
            <div class="header-container">
                <div class="logo-container">
                    <img src="/img/BEA.jpg" alt="BEA Logo" />
                </div>
                <div class="topnav" id="navbar">
                    <a href="/dashboard" class="nav-link">
                        <i class="fas fa-home"></i><span class="nav-text" th:text="#{dashboard}">Dashboard</span>
                    </a>

                    <a href="/contractsManager" class="nav-link" sec:authorize="hasAnyAuthority('ROLE_VALIDATOR1', 'ROLE_ADMIN')">
                        <i class="fas fa-file-contract"></i><span class="nav-text" th:text="#{contracts}">Contracts</span>
                    </a>

                     <a href="/userManager" class="nav-link" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <i class="fas fa-users"></i><span class="nav-text" th:text="#{users}">Users</span>
                     </a>

                    <a href="/track" class="nav-link" sec:authorize="hasAnyAuthority('ROLE_VALIDATOR2', 'ROLE_ADMIN')">
                     <i class="fas fa-file-contract"></i><span class="nav-text" th:text="#{signAndReview}">Sign & Review</span>
                     </a>

                    <a href="/analyse" class="nav-link" sec:authorize="isAuthenticated()">
                        <i class="fas fa-chart-line"></i><span class="nav-text" th:text="#{reports}">Reports</span>
                    </a>
                </div>
                <div class="header-right">
                    <div class="notif-container">
                        <i id="notifIcon" class="fa fa-bell notif-icon"></i>
                        <span id="notificationBadge" class="notif-badge">0</span>
                    </div>

                    <div class="action">
                        <div class="notif-container">
                            <div class="profile" onclick="menuToggle();">
                                <i id="user-icon" class="fas fa-user-circle user-icon"></i>
                            </div>
                        </div>
                        <div class="menu">
                            <h3 th:text="${name}">John Doe</h3>
                            <span th:text="${role}">Role</span>
                            <ul>
                                <li><i class="fas fa-user"></i><a href="#" th:text="#{myProfile}">My Profile</a></li>
                                <li><i class="fas fa-cog"></i><a href="#" th:text="#{settings}">Settings</a></li>
                                <li><i class="fas fa-sign-out-alt"></i><a href="/logout" th:text="#{logout}">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <main class="dashboard">
            <div id="welcomeToast" class="welcome-toast" th:if="${welcomeMessage}" th:text="${welcomeMessage}"></div>

            <section class="cards-container">
                <div class="card">
                    <h3 th:text="#{activeContracts}">Active Contracts</h3>
                    <div class="signed">
                        <strong th:text="${activeCount}">7</strong>
                    </div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>

                <div class="card">
                    <h3 th:text="#{approvedContracts}">Approved Contracts</h3>
                    <div class="signed">
                        <strong th:text="${approvedCount + ' / ' + (approvedCount + declinedCount)}">8 / 10</strong>
                        <p th:text="#{signedContracts}">Signed Contracts</p>
                    </div>
                    <div class="circle">
                        <svg viewBox="0 0 120 120">
                            <circle cx="55" cy="50" r="50" stroke="#e6e6e6" stroke-width="10" fill="none"/>
                            <circle id="circleProgress" cx="55" cy="50" r="50" stroke="#322C75" stroke-width="10" fill="none" stroke-linecap="round" />
                        </svg>
                        <span id="percentLabel">0%</span>
                    </div>
                    <input type="hidden" id="signedPercent" th:value="${(approvedCount * 100.0) / (approvedCount + declinedCount)}"/>
                </div>

                <div class="card">
                    <h3 th:text="#{contractStatus}">Contract Status</h3>
                    <div class="status">
                        <span class="approved"><i class="fa fa-check-circle"></i> <span th:text="${approvedCount}">8</span></span>
                        <span class="declined"><i class="fa fa-times-circle"></i> <span th:text="${declinedCount}">2</span></span>
                        <span class="pending"><i class="fa fa-clock"></i> <span th:text="${pendingCount}">0</span></span>
                    </div>
                    <div class="status-labels">
                        <span class="approved-text" th:text="#{approved}">Approved</span>
                        <span class="declined-text" th:text="#{declined}">Declined</span>
                        <span class="pending-text" th:text="#{pending}">Pending</span>
                    </div>
                </div>
            </section>

            <section class="chart-container">
                <input type="hidden" id="approvedMonthly" th:value="${approvedMonthly}"/>
                <input type="hidden" id="declinedMonthly" th:value="${declinedMonthly}"/>
                <canvas id="myChart"></canvas>
            </section>

            <div class="notif-popup" id="notifPopup">
                <div class="notif-header">
                    <h3 th:text="#{notifications}">Notifications</h3>
                    <div class="notif-filters">
                        <button class="filter-btn active" data-filter="all" th:text="#{all}">All</button>
                        <button class="filter-btn" data-filter="unread" th:text="#{unread}">Unread</button>
                        <button class="filter-btn" data-filter="read" th:text="#{read}">Read</button>
                    </div>
                </div>
                <div class="notif-content">
                    <span class="close-btn" id="closeNotif">&times;</span>
                    <ul id="notifList">
                        <!-- Notifications will be loaded here -->
                    </ul>
                </div>
            </div>
        </main>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/ws-notifications.js"></script>
    <script src="/js/dash.js"></script>
</body>
</html>
